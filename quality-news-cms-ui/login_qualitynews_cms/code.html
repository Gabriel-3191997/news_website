<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "panel-gap": "20px",
                        "container-margin": "24px",
                        "base": "4px"
                    },
                    "fontFamily": {

<body class="bg-background text-on-background font-body-md min-h-screen flex selection:bg-primary selection:text-on-primary">
<!-- Split Screen Container -->
<div class="flex w-full min-h-screen">
<!-- Left Column: Branding (Hidden on mobile) -->
<div class="hidden lg:flex w-1/2 bg-primary flex-col justify-between p-container-margin relative overflow-hidden">
<!-- Branding Header -->
<div class="z-10 mt-12 ml-12">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-4xl text-on-primary" data-icon="auto_awesome" data-weight="fill" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h1 class="font-headline-lg text-headline-lg text-on-primary">QualityNews</h1>
</div>
</div>
<!-- Tagline -->
<div class="z-10 mb-24 ml-12 max-w-md">
<p class="font-display-metrics text-display-metrics text-on-primary leading-tight">
                    Powering accurate journalism with intelligent editorial tools.
                </p>
</div>
<!-- Abstract Background Element for visual interest (Corporate Modern Minimalist) -->
<div class="absolute inset-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_bottom_right,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
<!-- Background Image Prompt -->
<div class="absolute inset-0 z-0 opacity-40 mix-blend-overlay" data-alt="Abstract architectural composition representing digital data and news flow. High contrast, monochromatic black and white with subtle blue-gray undertones. Clean lines, geometric shapes, and a sense of depth and structure. Minimalist corporate aesthetic, conveying trust and accuracy. Professional, high-end editorial mood." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDa17RbVsT3krAhXRMHXXAkNP4W2Q-xhgimoxJxTejga8wtAdLHLj_SBBnhpu2b-ApyEOKUqEDqDME6r0mr1gjlzsuIh2toatTkks6oNKHvCHxjHIYEMLeb9z-I_F454uPOUTEjT2CvnFVex4x-p9I-JcL9m5fa-8wR0_WgBpwQlc5ZHivS_U5DeeeaUtjcNqBzd65F-nZOqx279YHwt2a9lyT_dn_-xwRi1-pgVBqfEAFi55-7G6e1JQ')"></div>
</div>
<!-- Right Column: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-gutter bg-surface-container-lowest">
<div class="w-full max-w-md space-y-8">
<!-- Mobile Branding (Visible only on mobile) -->
<div class="lg:hidden flex items-center justify-center gap-2 mb-8">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="auto_awesome" data-weight="fill" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h1 class="font-headline-md text-headline-md text-primary">QualityNews</h1>
</div>
<div class="text-center lg:text-left">
<h2 class="font-headline-lg lg:text-headline-lg text-headline-lg-mobile text-on-surface mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to access your editorial dashboard.</p>
</div>
<form class="mt-8 space-y-6" onsubmit="event.preventDefault(); window.location.href='/dashboard';">
<div class="space-y-4">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input autocomplete="email" class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded bg-surface text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md" id="email" name="email" placeholder="editor@qualitynews.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded bg-surface text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface focus:outline-none transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded cursor-pointer bg-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-md text-label-md text-on-surface-variant cursor-pointer" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="font-label-md text-label-md">
<a class="text-primary hover:text-on-tertiary-container transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Sign In Button -->
<div>
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors font-label-md text-label-md uppercase tracking-wider group" type="submit">
                            Sign In
                            <span class="material-symbols-outlined ml-2 transform group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Support link -->
<div class="text-center mt-6">
<p class="font-label-sm text-label-sm text-on-surface-variant">Need help? <a class="text-primary hover:underline" href="#">Contact IT Support</a></p>
</div>
</div>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
                toggleIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
                toggleIcon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
</body></html>
